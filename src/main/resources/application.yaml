spring:
  application:
    name: overload-server
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      flush-mode: immediate
server:
  forward-headers-strategy: none
overload:
  gif:
    serving-enabled: ${OVERLOAD_GIF_SERVING_ENABLED:false}
    proxy-token: ${OVERLOAD_GIF_PROXY_TOKEN:}
